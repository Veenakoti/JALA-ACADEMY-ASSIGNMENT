<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot your password?</title>
  <link rel="stylesheet" href="css/login-page.css">
  <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body class="login-page">

  <div id="toastError" class="toast-error" style="display:none;">
    <span class="toast-icon">&#9888;</span>
    <div class="toast-text">
      <strong>Please enter valid email.</strong>
      <div>Error!</div>
    </div>
    <span class="toast-close" onclick="closeToast()">&times;</span>
  </div>

  <div class="forgot-page-inner">
    <h1 class="brand-title-large">Magnus</h1>

    <div class="forgot-card">
      <p class="forgot-title">Forgot Password</p>

      <form id="forgotForm" novalidate>
        <div class="input-group">
          <input type="email" id="fpEmail" name="email" placeholder="Email">
          <span class="input-icon">&#9993;</span>
        </div>
        <p id="fpError" class="field-error" style="display:none;">Please enter email.</p>

        <div class="forgot-actions">
          <a href="index.html" class="back-link">Back</a>
          <button type="submit" class="btn-get-password">Get Password</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/forgot-password.js"></script>
</body>
</html>
