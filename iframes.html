<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magnus - iFrames</title>
<style>
  :root{
    --blue: #4a90c4;
    --blue-dark: #3d7ba8;
    --sidebar-bg: #ffffff;
    --sidebar-border: #e2e6ea;
    --text-dark: #33475b;
    --text-muted: #7c8a99;
    --link-blue: #4a90c4;
    --bg: #f4f6f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Segoe UI", Arial, sans-serif;
    background:var(--bg);
    color:var(--text-dark);
  }
  .app{
    display:flex;
    min-height:100vh;
  }

  /* Sidebar */
  .sidebar{
    width:220px;
    background:var(--sidebar-bg);
    border-right:1px solid var(--sidebar-border);
    display:flex;
    flex-direction:column;
  }
  .sidebar-header{
    background:var(--blue);
    color:#fff;
    font-weight:bold;
    font-size:18px;
    padding:16px 20px;
  }
  .sidebar-user{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 20px;
    border-bottom:1px solid var(--sidebar-border);
  }
  .avatar{
    width:34px;height:34px;border-radius:50%;
    background:#dfe6ec;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:#8a97a3;
  }
  .sidebar-user .name{font-weight:600;font-size:14px;}
  .sidebar-user .role{font-size:12px;color:var(--text-muted);}

  nav.sidebar-nav{padding:8px 0;flex:1;}
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 20px;
    font-size:14px;
    color:var(--text-dark);
    cursor:pointer;
    text-decoration:none;
  }
  .nav-item:hover{background:#f0f4f8;}
  .nav-item.active{
    background:#eaf3fb;
    color:var(--blue-dark);
    font-weight:600;
    border-left:3px solid var(--blue);
    padding-left:17px;
  }
  .nav-group-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sub-nav{padding-left:14px;}
  .sub-nav .nav-item{font-size:13.5px;padding-top:8px;padding-bottom:8px;}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;}
  .topbar{
    background:var(--blue);
    color:#fff;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding:0 24px;
  }
  .logout{
    display:flex;align-items:center;gap:6px;
    font-size:14px;cursor:pointer;
  }

  .content{padding:20px 30px;}
  h1.page-title{margin:0 0 6px 0;font-size:22px;color:#22303f;}
  .breadcrumb{
    color:var(--text-muted);
    font-size:13px;
    margin-bottom:18px;
  }
  .breadcrumb a{color:var(--link-blue);text-decoration:none;}
  .breadcrumb .sep{margin:0 6px;}

  .tabs{border-bottom:1px solid var(--sidebar-border);margin-bottom:24px;}
  .tab{
    display:inline-block;
    padding:10px 4px;
    margin-right:20px;
    font-size:14px;
    color:var(--blue-dark);
    border-bottom:2px solid var(--blue);
    cursor:pointer;
  }

  .frame-block{
    text-align:center;
    margin-bottom:50px;
  }
  .frame-label{
    font-size:16px;
    color:#22303f;
    margin-bottom:18px;
  }
  iframe{
    border:1px solid #cfd8e0;
    border-radius:2px;
    background:#fff;
  }
  #frameOne{width:100%;max-width:1100px;height:300px;}
  #frameTwo{width:380px;height:220px;}
  #frameThree{width:100%;max-width:1100px;height:220px;}
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">Magnus</div>
    <div class="sidebar-user">
      <div class="avatar">&#128100;</div>
      <div>
        <div class="name">Guest User</div>
        <div class="role">User</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="#">Home</a>
      <a class="nav-item" href="#">Employee</a>
      <a class="nav-item active" href="#">More</a>
      <div class="sub-nav">
        <a class="nav-item" href="#">Multiple Tabs</a>
        <a class="nav-item" href="#">Menu</a>
        <a class="nav-item" href="#">Autocomplete</a>
        <a class="nav-item" href="#">Collapsible Content</a>
        <a class="nav-item" href="#">Images</a>
        <a class="nav-item" href="#">Slider</a>
        <a class="nav-item" href="#">Tooltips</a>
        <a class="nav-item" href="#">Popups</a>
        <a class="nav-item" href="#">Links</a>
        <a class="nav-item" href="#">CSS Properties</a>
        <a class="nav-item active" href="#">iFrames</a>
      </div>
      <a class="nav-item" href="#">Settings</a>
    </nav>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="logout">&#10148; Logout</div>
    </div>

    <div class="content">
      <h1 class="page-title">iFrames</h1>
      <div class="breadcrumb">
        <a href="#">Home</a><span class="sep">&gt;</span>
        <a href="#">More</a><span class="sep">&gt;</span>
        iFrames
      </div>

      <div class="tabs">
        <span class="tab">Iframes</span>
      </div>

      <div class="frame-block">
        <div class="frame-label">Frame One</div>
        <iframe id="frameOne" title="Frame One"></iframe>
      </div>

      <div class="frame-block">
        <div class="frame-label">Frame Two</div>
        <iframe id="frameTwo" title="Frame Two"></iframe>
      </div>

      <div class="frame-block">
        <div class="frame-label">Frame Three</div>
        <iframe id="frameThree" title="Frame Three"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
  // Content injected into each iframe via JS (srcdoc equivalent using contentDocument)

  const frameOneHTML = `
    <html><body style="margin:0;font-family:Segoe UI,Arial,sans-serif;
      display:flex;align-items:center;justify-content:center;height:100%;color:#7c8a99;">
      <p>Frame One content area</p>
    </body></html>
  `;

  const frameTwoHTML = `
    <html>
    <head>
    <style>
      body{margin:0;font-family:Segoe UI,Arial,sans-serif;}
      .header{background:#4a90c4;color:#fff;font-weight:bold;padding:10px 14px;font-size:15px;}
      .subnav{background:#3d7ba8;color:#fff;display:flex;justify-content:space-between;
        align-items:center;padding:10px 14px;font-size:14px;}
      .welcome{padding:40px 14px;font-size:16px;color:#22303f;}
    </style>
    </head>
    <body>
      <div class="header">Magnus</div>
      <div class="subnav"><span>&#9776;</span><span>&#10148;</span></div>
      <div class="welcome">Welcome to JALA Academy</div>
    </body>
    </html>
  `;

  const frameThreeHTML = `
    <html><body style="margin:0;font-family:Segoe UI,Arial,sans-serif;
      display:flex;align-items:center;justify-content:center;height:100%;color:#7c8a99;">
      <p>Frame Three content area</p>
    </body></html>
  `;

  function loadFrame(id, html){
    const frame = document.getElementById(id);
    frame.srcdoc = html;
  }

  loadFrame('frameOne', frameOneHTML);
  loadFrame('frameTwo', frameTwoHTML);
  loadFrame('frameThree', frameThreeHTML);
</script>
</body>
</html>
